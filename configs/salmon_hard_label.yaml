# SALMONN-7B hard-label LoRA SFT (L1).
General:
  output_dir: "${OUTPUT_DIR}/salmon_hard_label_2"

Logger:
  log_freq: 20
  save_all_predictions: false

Prompts:
  hard_label_prompts: src/prompts/sasv_prompt.json

Model:
  model_name: sasv_salmon
  ddp_static_graph: true
  ckpt: "${SALMONN_CKPT}"
  lora:
    enabled: true
    alpha: 256
    rank: 128
    lora_dropout: 0.05
    projections: all
  amp: true
  max_txt_len: 512
  additional_kwargs:
    salmon:
      debug: false
      new_lora: true

      pretrained_ckpts:
        llama_path: "${LLAMA_PATH}"
        whisper_path: "${WHISPER_PATH}"
        beats_path: "${BEATS_PATH}"

      freeze_whisper: false
      whisper_unfreeze_last_n_layers: -1
      use_speech_Qformer: true
      num_speech_query_token: 1
      freeze_speech_QFormer: false
      window_level_Qformer: true
      second_per_window: 0.333333
      second_stride: 0.333333
      silence_delay_seconds: 1.0
      enable_speaker_classification: false
      enable_bonafide_spoof_classification: false
      ce1_lambda: 1.0


Datasets:
  dataset_train_path: "/home/jovyan/mnt_shared/dvirnyak/sasv_reasoning_coldstart/merged_balanced/all_clean_with_acoustics_v2.json"
  dataset_val_path: "${DATA_ROOT}/sasv_asv5_dev_pairs_balanced.json"
  dataset_test_path: "${DATA_ROOT}/sasv_asv5_dev_pairs_balanced.json"
  max_valid_samples: 512
  max_test_samples: 2048
  train_samples_offset: 0
  val_samples_offset: 0
  test_samples_offset: 0
  shuffle: true


Runner:
  type: train
  trainer: SFT
  num_gpus: 2
  num_workers: 4
  SFT:
    task_type: hard_label
    batch_size_train: 1
    batch_size_eval: 1
    num_epochs: 2
    iters_per_epoch: 20
    iters_per_epoch_val: null
    accum_grad_iters: 32
    generation:
      max_new_tokens: 16
      num_beams: 1
      do_sample: false
    optimizator:
      init_lr: 1.0e-5
      min_lr: 1.0e-6
      warmup_start_lr: 0.0
      warmup_steps: 16
      weight_decay: 0.05
      beta2: 0.999
      max_grad_norm: 1.0
  Test:
    batch_size: 8
    save_all_predictions: true
    extract_confidence: true
    threshold_objective: min_a_dcf
    generation:
      max_new_tokens: 16
      num_beams: 1
      do_sample: false


Audio:
  target_sr: 16000
  max_len_sec: 8.0
  min_len_sec: 1.0
  pad_mode: repeat
  train_max_len_sec: 6.0
  train_enroll_max_len_sec: 6.0
  train_query_max_len_sec: 6.0
  test_max_len_sec: 8.0
  test_enroll_max_len_sec: 8.0
  test_query_max_len_sec: 8.0
  vad:
    enabled: true
  crop:
    enabled: true
  aug:
    enabled: true
    p_noise: 0.1
    snr_db: [9, 15]
    p_rir: 0.07
    p_rawboost: 0.07
    noise_paths_txt: "${DATA_ROOT}/noise_list.txt"
    rir_paths_txt: "${DATA_ROOT}/rir_list.txt"
    rir_max_len_sec: 2.0

